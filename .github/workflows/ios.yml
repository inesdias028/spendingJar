name: Build iPhone app

# Builds the native SwiftUI app on one of GitHub's Macs and saves Even.ipa,
# ready to install with Sideloadly or AltStore (see ios/README.md).
on:
  push:
    branches: [main, ios-app]
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Make the Xcode project
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned)
        working-directory: ios
        run: |
          set +e
          xcodebuild -project Even.xcodeproj -scheme Even -configuration Release \
            -destination "generic/platform=iOS" -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1
          status=$?
          tail -n 40 build.log
          # Show compile errors as annotations so they are easy to read on the run page.
          grep -E "error: " build.log | sort -u | head -n 10 | while IFS= read -r line; do
            echo "::error::${line}"
          done
          exit $status

      - name: Package Even.ipa
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Even.app Payload/
          zip -qry Even.ipa Payload
          ls -lh Even.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Even-ipa
          path: ios/Even.ipa
          retention-days: 30
