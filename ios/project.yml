# XcodeGen project description for the native iPhone app.
# On a Mac:  brew install xcodegen && cd ios && xcodegen generate && open Even.xcodeproj
# GitHub builds it the same way (.github/workflows/ios.yml).
name: Even
options:
  bundleIdPrefix: io.github.inesdias028
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 12.0.0

targets:
  Even:
    type: application
    platform: iOS
    sources:
      - path: Even
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.inesdias028.even
        PRODUCT_NAME: Even
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Even
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
